<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up - Airline DBMS</title>
<style>body{font-family:Segoe UI,sans-serif;background:#0b3d91;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.box{background:#fff;padding:26px;border-radius:10px;min-width:340px}.input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:6px}.btn{width:100%;background:#ff6b35;color:#fff;border:none;padding:10px;border-radius:6px;cursor:pointer}</style></head>
<body><div class="box"><h2>✈️ Create Passenger Account</h2>{% if error %}<p style="color:#c0392b">{{ error }}</p>{% endif %}<form method="POST" action="/signup"><label>Username</label><input class="input" type="text" name="username" required><label>Email</label><input class="input" type="email" name="email" required><label>Password</label><input class="input" type="password" name="password" required><button class="btn" type="submit">Sign Up</button></form><p style="margin-top:12px">Already registered? <a href="/login">Login</a></p></div></body></html>
